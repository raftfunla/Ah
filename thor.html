<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Top Down Survivor</title>
  <style>
    :root {
      --bg-1: #0a1522;
      --bg-2: #132f40;
      --panel: rgba(12, 20, 35, 0.7);
      --panel-border: rgba(255,255,255,0.12);
      --text: #edf5ff;
      --accent: #7ae7a2;
      --accent-2: #6cc4ff;
      --danger: #ff6b6b;
      --gold: #ffd166;
      --shadow: rgba(0,0,0,0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }

    body {
      position: relative;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, #0a1826, #10263d 35%, #0b1d2d 100%);
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 14px 18px;
    }

    .bars {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 260px;
      max-width: 34vw;
    }

    .bar {
      position: relative;
      height: 18px;
      background: rgba(0,0,0,0.33);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
    }

    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      border-radius: inherit;
      transition: width 0.12s linear;
    }

    .fill.hp { background: linear-gradient(90deg, #ff4d4d, #ff7d7d); }
    .fill.food { background: linear-gradient(90deg, #ffaf3d, #ffc95d); }
    .fill.water { background: linear-gradient(90deg, #4cb5ff, #77d4ff); }

    .icon {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      opacity: 0.95;
    }

    .stash {
      display: flex;
      gap: 10px;
      padding: 4px 10px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: 0 10px 25px var(--shadow);
      backdrop-filter: blur(4px);
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      font-weight: 700;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .right-panel {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
    }

    .btn {
      width: 86px;
      padding: 10px 8px;
      border-radius: 14px;
      background: rgba(14, 24, 37, 0.8);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 22px var(--shadow);
      color: var(--text);
      text-align: center;
      cursor: pointer;
      transition: transform 0.08s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn.active {
      border-color: rgba(122, 231, 162, 0.8);
      box-shadow: 0 0 18px rgba(122, 231, 162, 0.3);
      background: rgba(18, 58, 38, 0.75);
    }

    .btn .emoji { display: block; font-size: 24px; }
    .btn .label { display: block; font-size: 10px; opacity: 0.8; margin-top: 2px; }

    .action {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ff5d6d, #de2c3d);
      border: 3px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 25px rgba(255, 93, 109, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      cursor: pointer;
      pointer-events: auto;
    }

    #message {
      position: absolute;
      left: 50%;
      top: 18%;
      transform: translate(-50%, -50%);
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(255, 80, 80, 0.8);
      color: white;
      font-weight: 700;
      letter-spacing: 0.5px;
      opacity: 0;
      transition: opacity 0.18s ease;
      pointer-events: none;
    }

    .touch {
      position: absolute;
      width: 40%;
      height: 46%;
      bottom: 0;
      pointer-events: auto;
    }

    #touch-left { left: 0; }
    #touch-right { right: 0; }

    .joy {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      transform: translate(-50%, -50%);
      display: none;
    }

    .knob {
      position: absolute;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      left: 37px;
      top: 37px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }

    @media (max-width: 700px) {
      .bars { width: 200px; }
      .stash { gap: 6px; padding: 4px 8px; }
      .chip { padding: 6px 8px; }
      .btn { width: 70px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="topbar">
      <div class="bars">
        <div class="bar"><div id="hpBar" class="fill hp"></div><span class="icon">❤</span></div>
        <div class="bar"><div id="foodBar" class="fill food"></div><span class="icon">🍖</span></div>
        <div class="bar"><div id="waterBar" class="fill water"></div><span class="icon">💧</span></div>
      </div>

      <div class="stash">
        <div class="chip">🪵 <span id="woodCount">0</span></div>
        <div class="chip">🔩 <span id="metalCount">0</span></div>
      </div>
    </div>

    <div id="message">MESAJ</div>

    <div class="right-panel">
      <div class="btn active" data-mode="hook"><span class="emoji">🪝</span><span class="label">kanca</span></div>
      <div class="btn" data-mode="wall"><span class="emoji">🧱</span><span class="label">duvar</span></div>
      <div class="btn" data-mode="trap"><span class="emoji">⚔</span><span class="label">tuzak</span></div>
    </div>

    <div class="action" id="actionBtn">🪝</div>

    <div id="touch-left" class="touch">
      <div id="joyLeft" class="joy"><div id="knobLeft" class="knob"></div></div>
    </div>

    <div id="touch-right" class="touch">
      <div id="joyRight" class="joy"><div id="knobRight" class="knob"></div></div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const hud = {
        hp: document.getElementById('hpBar'),
        food: document.getElementById('foodBar'),
        water: document.getElementById('waterBar'),
        wood: document.getElementById('woodCount'),
        metal: document.getElementById('metalCount'),
        message: document.getElementById('message'),
        action: document.getElementById('actionBtn')
      };

      const state = {
        w: 0,
        h: 0,
        time: 0,
        camera: { x: 0, y: 0 },
        zoom: 0.85,
        pointer: { x: 0, y: 0 },
        buildMode: 'hook',
        world: {
          width: 2200,
          height: 2200
        },
        player: {
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          radius: 17,
          speed: 220,
          angle: 0,
          hp: 100,
          food: 90,
          water: 90,
          wood: 12,
          metal: 8,
          bob: 0
        },
        hook: {
          x: 0,
          y: 0,
          active: false,
          returning: false,
          speed: 760,
          hit: null,
          length: 0,
          target: null,
          color: '#d7b289'
        },
        resources: [],
        enemies: [],
        structures: [],
        particles: []
      };

      const keys = {};
      const input = {
        moveX: 0,
        moveY: 0,
        aimX: 1,
        aimY: 0,
        aiming: false,
        touchLeft: false,
        touchRight: false
      };

      function resize() {
        state.w = window.innerWidth;
        state.h = window.innerHeight;
        canvas.width = state.w * Math.min(window.devicePixelRatio || 1, 2);
        canvas.height = state.h * Math.min(window.devicePixelRatio || 1, 2);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function norm(x, y) {
        const len = Math.hypot(x, y);
        if (len < 0.0001) return { x: 0, y: 0 };
        return { x: x / len, y: y / len };
      }

      function showMessage(text, color = 'rgba(255, 90, 90, 0.84)') {
        hud.message.textContent = text;
        hud.message.style.opacity = '1';
        hud.message.style.background = color;
        clearTimeout(showMessage.timer);
        showMessage.timer = setTimeout(() => {
          hud.message.style.opacity = '0';
        }, 1400);
      }

      function setMode(mode) {
        state.buildMode = mode;
        document.querySelectorAll('.btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });

        const emojiMap = {
          hook: '🪝',
          wall: '🧱',
          trap: '⚔'
        };
        hud.action.textContent = emojiMap[mode] || '🪝';
      }

      function makeResource(type, x, y) {
        return {
          id: Math.random() + Date.now(),
          type,
          x,
          y,
          r: type === 'metal' ? 12 : 14,
          value: type === 'wood' ? 1 : 2,
          active: true,
          bob: Math.random() * Math.PI * 2
        };
      }

      function initWorld() {
        state.resources = [];
        state.enemies = [];
        state.structures = [];

        for (let i = 0; i < 28; i++) {
          const type = Math.random() < 0.7 ? 'wood' : 'metal';
          const x = (Math.random() - 0.5) * 1800;
          const y = (Math.random() - 0.5) * 1800;
          state.resources.push(makeResource(type, x, y));
        }

        for (let i = 0; i < 7; i++) {
          state.enemies.push({
            x: (Math.random() - 0.5) * 1500,
            y: (Math.random() - 0.5) * 1500,
            angle: Math.random() * Math.PI * 2,
            speed: 48 + Math.random() * 35,
            radius: 14,
            hp: 40,
            phase: Math.random() * Math.PI * 2,
            attackCooldown: 0
          });
        }
      }

      function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 35 + Math.random() * 120;
          state.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.7 + Math.random() * 0.7,
            color
          });
        }
      }

      function setPlayerStart() {
        state.player.x = 0;
        state.player.y = 0;
        state.camera.x = 0;
        state.camera.y = 0;
      }

      function updateHud() {
        hud.hp.style.width = (state.player.hp / 100) * 100 + '%';
        hud.food.style.width = (state.player.food / 100) * 100 + '%';
        hud.water.style.width = (state.player.water / 100) * 100 + '%';
        hud.wood.textContent = Math.floor(state.player.wood);
        hud.metal.textContent = Math.floor(state.player.metal);
      }

      function updateInput() {
        const keyX = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
        const keyY = (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0) - (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0);

        input.moveX = keyX * (input.touchLeft ? 0 : 1) + (input.touchLeft ? input.moveX : 0);
        input.moveY = keyY * (input.touchLeft ? 0 : 1) + (input.touchLeft ? input.moveY : 0);

        if (!input.touchLeft) {
          input.moveX = keyX;
          input.moveY = keyY;
        }

        const dir = norm(input.aimX, input.aimY);
        input.aimX = dir.x;
        input.aimY = dir.y;

        if (input.aimX === 0 && input.aimY === 0) {
          input.aimX = 1;
          input.aimY = 0;
        }
      }

      function shootHook() {
        if (state.hook.active) return;

        const aim = { x: input.aimX, y: input.aimY };
        const dist = Math.hypot(aim.x, aim.y) || 1;
        const sx = state.player.x + (aim.x / dist) * 14;
        const sy = state.player.y + (aim.y / dist) * 14;

        state.hook.x = sx;
        state.hook.y = sy;
        state.hook.active = true;
        state.hook.returning = false;
        state.hook.hit = null;
        state.hook.target = null;
        state.hook.length = 0;

        state.hook.vx = (aim.x / dist) * state.hook.speed;
        state.hook.vy = (aim.y / dist) * state.hook.speed;
      }

      function resolveBuildPlacement() {
        const dx = input.aimX;
        const dy = input.aimY;
        const len = Math.hypot(dx, dy) || 1;
        const targetX = state.player.x + (dx / len) * 110;
        const targetY = state.player.y + (dy / len) * 110;

        if (state.buildMode === 'wall') {
          if (state.player.wood < 4) {
            showMessage('Yeterli odun yok!', 'rgba(255, 90, 90, 0.88)');
            return;
          }

          const wall = {
            x: targetX,
            y: targetY,
            w: 28,
            h: 28,
            hp: 120,
            type: 'wall'
          };
          state.structures.push(wall);
          state.player.wood -= 4;
          spawnParticles(wall.x, wall.y, '#9ec3ff', 10);
          showMessage('Duvar kuruldu', 'rgba(74, 211, 139, 0.82)');
        }

        if (state.buildMode === 'trap') {
          if (state.player.wood < 3 || state.player.metal < 2) {
            showMessage('Tuzak için kaynak yok!', 'rgba(255, 90, 90, 0.88)');
            return;
          }

          const trap = {
            x: targetX,
            y: targetY,
            radius: 14,
            cooldown: 0,
            active: true,
            type: 'trap'
          };
          state.structures.push(trap);
          state.player.wood -= 3;
          state.player.metal -= 2;
          spawnParticles(trap.x, trap.y, '#ffae00', 10);
          showMessage('Tuzak yerleşti', 'rgba(255, 191, 72, 0.88)');
        }
      }

      function actionPressed() {
        if (state.buildMode === 'hook') {
          shootHook();
        } else {
          resolveBuildPlacement();
        }
      }

      function updateHook(dt) {
        const hook = state.hook;

        if (!hook.active) return;

        hook.x += hook.vx * dt;
        hook.y += hook.vy * dt;

        const distToPlayer = Math.hypot(hook.x - state.player.x, hook.y - state.player.y);
        if (distToPlayer > 620) {
          hook.active = false;
          hook.returning = false;
          hook.hit = null;
        }

        for (const res of state.resources) {
          if (!res.active) continue;
          const d = Math.hypot(hook.x - res.x, hook.y - res.y);
          if (d < res.r + 10) {
            hook.active = false;
            hook.returning = true;
            hook.hit = res;
            res.active = false;
            if (res.type === 'wood') state.player.wood += 2;
            if (res.type === 'metal') state.player.metal += 2;
            spawnParticles(res.x, res.y, '#ffd166', 14);
            showMessage('Malzeme toplandı', 'rgba(122, 231, 162, 0.82)');
            break;
          }
        }

        if (hook.active) {
          for (const enemy of state.enemies) {
            const d = Math.hypot(hook.x - enemy.x, hook.y - enemy.y);
            if (d < enemy.radius + 12) {
              hook.active = false;
              hook.returning = true;
              hook.hit = enemy;
              enemy.hp -= 20;
              spawnParticles(enemy.x, enemy.y, '#ff6b6b', 12);
              if (enemy.hp <= 0) {
                enemy.x = -9999;
                enemy.y = -9999;
                state.player.wood += 1;
                showMessage('Yabani düşürüldü', 'rgba(255, 134, 134, 0.82)');
              }
              break;
            }
          }
        }

        if (hook.returning && hook.hit) {
          const toPlayerX = state.player.x - hook.x;
          const toPlayerY = state.player.y - hook.y;
          const len = Math.hypot(toPlayerX, toPlayerY) || 1;
          hook.x += (toPlayerX / len) * 620 * dt;
          hook.y += (toPlayerY / len) * 620 * dt;

          if (len < 28) {
            hook.returning = false;
            hook.hit = null;
          }
        }
      }

      function updateStructures(dt) {
        for (let i = state.structures.length - 1; i >= 0; i--) {
          const s = state.structures[i];
          if (s.type === 'trap') {
            s.cooldown -= dt;
            const dist = Math.hypot(state.player.x - s.x, state.player.y - s.y);
            if (dist < 22 && s.cooldown <= 0) {
              state.player.hp = Math.max(0, state.player.hp - 18);
              s.cooldown = 1.5;
              spawnParticles(s.x, s.y, '#ff8f6b', 16);
              showMessage('Tuzak vurdu!', 'rgba(255, 110, 110, 0.9)');
            }
          }
        }
      }

      function updateEnemies(dt) {
        for (const enemy of state.enemies) {
          if (enemy.hp <= 0) continue;

          const dx = state.player.x - enemy.x;
          const dy = state.player.y - enemy.y;
          const dist = Math.hypot(dx, dy);

          if (dist > 0.0001) {
            enemy.x += (dx / dist) * enemy.speed * dt;
            enemy.y += (dy / dist) * enemy.speed * dt;
          }

          enemy.angle = Math.atan2(dy, dx);

          if (dist < enemy.radius + state.player.radius + 2) {
            state.player.hp -= 13 * dt;
            state.player.food = Math.max(0, state.player.food - 8 * dt);
          }
        }
      }

      function updatePlayer(dt) {
        const dir = norm(input.moveX, input.moveY);
        const moveLen = Math.hypot(input.moveX, input.moveY);

        state.player.vx = dir.x * state.player.speed * moveLen;
        state.player.vy = dir.y * state.player.speed * moveLen;

        state.player.x += state.player.vx * dt;
        state.player.y += state.player.vy * dt;

        state.player.x = clamp(state.player.x, -state.world.width / 2, state.world.width / 2);
        state.player.y = clamp(state.player.y, -state.world.height / 2, state.world.height / 2);

        const aimX = input.aimX;
        const aimY = input.aimY;
        const aimLen = Math.hypot(aimX, aimY) || 1;
        state.player.angle = Math.atan2(aimY / aimLen, aimX / aimLen);

        state.player.food = Math.max(0, state.player.food - 0.5 * dt);
        state.player.water = Math.max(0, state.player.water - 0.7 * dt);

        if (state.player.food <= 0 || state.player.water <= 0) {
          state.player.hp -= 8 * dt;
        }

        if (state.player.hp <= 0) {
          showMessage('Öldün! Yeniden başlatılıyor...', 'rgba(255, 92, 92, 0.92)');
          setTimeout(() => {
            initWorld();
            setPlayerStart();
            state.player.hp = 100;
            state.player.food = 90;
            state.player.water = 90;
            state.player.wood = 12;
            state.player.metal = 8;
          }, 1000);
        }

        state.player.bob += dt * (moveLen > 0.1 ? 11 : 6);

        for (const res of state.resources) {
          if (!res.active) continue;
          const d = Math.hypot(state.player.x - res.x, state.player.y - res.y);
          if (d < state.player.radius + res.r + 5) {
            if (res.type === 'wood') state.player.wood += 1;
            if (res.type === 'metal') state.player.metal += 1;
            res.active = false;
            spawnParticles(res.x, res.y, '#d3f5ff', 12);
          }
        }
      }

      function updateParticles(dt) {
        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) state.particles.splice(i, 1);
        }
      }

      function updateCamera() {
        const targetX = state.player.x;
        const targetY = state.player.y;
        state.camera.x += (targetX - state.camera.x) * 0.08;
        state.camera.y += (targetY - state.camera.y) * 0.08;
      }

      function update(dt) {
        state.time += dt;
        updateInput();
        updatePlayer(dt);
        updateHook(dt);
        updateStructures(dt);
        updateEnemies(dt);
        updateParticles(dt);
        updateCamera();
        updateHud();
      }

      function drawBackground() {
        const grad = ctx.createLinearGradient(0, 0, 0, state.h);
        grad.addColorStop(0, '#0a1522');
        grad.addColorStop(1, '#132f40');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, state.w, state.h);

        ctx.fillStyle = 'rgba(18, 34, 52, 0.4)';
        for (let gx = -80; gx < 80; gx++) {
          for (let gy = -80; gy < 80; gy++) {
            const x = gx * 40 - ((state.camera.x * 0.14) % 40);
            const y = gy * 40 - ((state.camera.y * 0.14) % 40);
            ctx.fillRect(x, y, 2, 2);
          }
        }
      }

      function drawWorld() {
        ctx.save();
        ctx.translate(state.w / 2, state.h / 2);
        ctx.scale(state.zoom, state.zoom);
        ctx.translate(-state.camera.x, -state.camera.y);

        ctx.fillStyle = '#18425e';
        ctx.fillRect(-2500, -2500, 5000, 5000);

        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        for (let x = -1100; x <= 1100; x += 100) {
          ctx.beginPath();
          ctx.moveTo(x, -1200);
          ctx.lineTo(x, 1200);
          ctx.stroke();
        }
        for (let y = -1100; y <= 1100; y += 100) {
          ctx.beginPath();
          ctx.moveTo(-1200, y);
          ctx.lineTo(1200, y);
          ctx.stroke();
        }

        for (const res of state.resources) {
          if (!res.active) continue;
          const bob = Math.sin(state.time * 3 + res.bob) * 3;
          if (res.type === 'wood') {
            ctx.fillStyle = '#8e5a2b';
            ctx.fillRect(res.x - 8, res.y - 12 + bob, 16, 24);
            ctx.fillStyle = '#d9a35a';
            ctx.fillRect(res.x - 3, res.y - 9 + bob, 6, 18);
          } else {
            ctx.fillStyle = '#7a8ca7';
            ctx.beginPath();
            ctx.arc(res.x, res.y + bob, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#c7d8ef';
            ctx.fillRect(res.x - 2, res.y - 8 + bob, 4, 16);
          }
        }

        for (const s of state.structures) {
          if (s.type === 'wall') {
            ctx.fillStyle = '#88a0ae';
            ctx.fillRect(s.x - 14, s.y - 14, 28, 28);
            ctx.strokeStyle = '#dfeaf7';
            ctx.strokeRect(s.x - 14, s.y - 14, 28, 28);
          }

          if (s.type === 'trap') {
            ctx.fillStyle = '#ff9e44';
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a1d24';
            ctx.fillRect(s.x - 4, s.y - 10, 8, 20);
          }
        }

        for (const enemy of state.enemies) {
          if (enemy.hp <= 0) continue;
          ctx.save();
          ctx.translate(enemy.x, enemy.y);
          ctx.rotate(enemy.angle);
          ctx.fillStyle = '#8f0f27';
          ctx.beginPath();
          ctx.ellipse(0, 0, 16, 11, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#f1d0a6';
          ctx.beginPath();
          ctx.arc(0, -15, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        drawPlayer();

        if (state.hook.active || state.hook.returning) {
          ctx.strokeStyle = '#d7b289';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(state.player.x, state.player.y);
          ctx.lineTo(state.hook.x, state.hook.y);
          ctx.stroke();

          ctx.fillStyle = '#d7b289';
          ctx.beginPath();
          ctx.arc(state.hook.x, state.hook.y, 6, 0, Math.PI * 2);
          ctx.fill();
        }

        for (const p of state.particles) {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = clamp(p.life, 0, 1);
          ctx.fillRect(p.x, p.y, 4, 4);
          ctx.globalAlpha = 1;
        }

        ctx.restore();
      }

      function drawPlayer() {
        const p = state.player;
        const walk = Math.sin(p.bob) * (Math.hypot(p.vx, p.vy) > 5 ? 3 : 0.8);

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(1, 19, 19, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Backpack sits behind the shoulders and keeps the silhouette readable.
        ctx.fillStyle = '#263b50';
        ctx.beginPath();
        ctx.roundRect(-15, -1, 10, 21, 5);
        ctx.fill();
        ctx.fillStyle = '#48657b';
        ctx.fillRect(-14, 3, 8, 3);

        // Legs are drawn before the torso so they feel attached underneath it.
        ctx.strokeStyle = '#26374b';
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-7, 10);
        ctx.lineTo(-9 - walk, 24);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(7, 10);
        ctx.lineTo(9 + walk, 24);
        ctx.stroke();
        ctx.fillStyle = '#182431';
        ctx.fillRect(-14 - walk, 23, 8, 5);
        ctx.fillRect(6 + walk, 23, 8, 5);

        // Arms remain in local player space; the player rotation above handles aim.
        ctx.strokeStyle = '#315d99';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(-10, 1);
        ctx.lineTo(13, 9 + walk * 0.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(10, 1);
        ctx.lineTo(22, -8 - walk * 0.5);
        ctx.stroke();

        ctx.strokeStyle = '#f3c79e';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(13, 9 + walk * 0.5);
        ctx.lineTo(20, 11 + walk * 0.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(22, -8 - walk * 0.5);
        ctx.lineTo(28, -11 - walk * 0.5);
        ctx.stroke();

        // Torso with a collar, belt and front highlight.
        ctx.fillStyle = '#4c7ed7';
        ctx.beginPath();
        ctx.ellipse(0, 2, 17, 14, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#78a7f0';
        ctx.beginPath();
        ctx.ellipse(7, -2, 5, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1f416e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-13, 7);
        ctx.lineTo(13, 7);
        ctx.stroke();

        // Head, hair and face point toward the current aim direction.
        ctx.fillStyle = '#f3c79e';
        ctx.beginPath();
        ctx.arc(8, -15, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#553321';
        ctx.beginPath();
        ctx.arc(8, -19, 10, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c92a39';
        ctx.beginPath();
        ctx.moveTo(0, -21);
        ctx.lineTo(18, -21);
        ctx.lineTo(13, -14);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#162434';
        ctx.beginPath();
        ctx.arc(13, -15, 1.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(18, -15, 1.7, 0, Math.PI * 2);
        ctx.fill();

        // The hook is held by the forward hand, instead of floating beside the body.
        ctx.save();
        ctx.translate(30, -13 - walk * 0.5);
        ctx.rotate(Math.PI / 2);
        ctx.fillStyle = '#d5b586';
        ctx.fillRect(-2, -9, 4, 16);
        ctx.beginPath();
        ctx.arc(0, -13, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-7, 6);
        ctx.lineTo(7, 6);
        ctx.lineTo(0, 12);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        ctx.restore();
      }

      function draw() {
        drawBackground();
        drawWorld();
      }

      function loop(now) {
        const dt = Math.min((now - (loop.last || now)) / 1000, 0.033);
        loop.last = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      function onPointerMove(e) {
        const rect = canvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;
        const centerX = state.w / 2;
        const centerY = state.h / 2;
        const dx = px - centerX;
        const dy = py - centerY;
        const len = Math.hypot(dx, dy) || 1;

        input.aimX = dx / len;
        input.aimY = dy / len;
        input.aiming = true;
      }

      function attachEvents() {
        window.addEventListener('resize', resize);
        resize();

        document.addEventListener('keydown', (e) => {
          keys[e.code] = true;
          if (e.code === 'KeyE') actionPressed();
        });
        document.addEventListener('keyup', (e) => {
          keys[e.code] = false;
        });

        canvas.addEventListener('pointermove', onPointerMove);
        canvas.addEventListener('pointerdown', (e) => {
          if (e.button === 0) actionPressed();
        });
        document.getElementById('actionBtn').addEventListener('click', actionPressed);

        document.querySelectorAll('.btn').forEach((btn) => {
          btn.addEventListener('click', () => setMode(btn.dataset.mode));
        });

        setupTouch('touch-left', 'joyLeft', 'knobLeft', true);
        setupTouch('touch-right', 'joyRight', 'knobRight', false);
      }

      function setupTouch(zoneId, joyId, knobId, isLeft) {
        const zone = document.getElementById(zoneId);
        const base = document.getElementById(joyId);
        const knob = document.getElementById(knobId);
        let activeId = null;
        let originX = 0;
        let originY = 0;

        const reset = () => {
          activeId = null;
          base.style.display = 'none';
          knob.style.transform = 'translate(0px, 0px)';
          if (isLeft) {
            input.touchLeft = false;
            input.moveX = 0;
            input.moveY = 0;
          }
        };

        zone.addEventListener('touchstart', (e) => {
          const t = e.changedTouches[0];
          activeId = t.identifier;
          const rect = zone.getBoundingClientRect();
          originX = rect.left + rect.width / 2;
          originY = rect.top + rect.height / 2;
          base.style.display = 'block';
          base.style.left = originX + 'px';
          base.style.top = originY + 'px';
          if (isLeft) input.touchLeft = true;
          e.preventDefault();
        }, { passive: false });

        zone.addEventListener('touchmove', (e) => {
          if (activeId === null) return;
          for (const t of e.changedTouches) {
            if (t.identifier !== activeId) continue;
            let dx = t.clientX - originX;
            let dy = t.clientY - originY;
            const limit = 30;
            const dist = Math.hypot(dx, dy);
            if (dist > limit) {
              const scale = limit / dist;
              dx *= scale;
              dy *= scale;
            }
            knob.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';

            if (isLeft) {
              input.moveX = clamp(dx / limit, -1, 1);
              input.moveY = clamp(dy / limit, -1, 1);
            } else {
              const len = Math.hypot(dx, dy) || 1;
              input.aimX = clamp(dx / len, -1, 1);
              input.aimY = clamp(dy / len, -1, 1);
            }
          }
          e.preventDefault();
        }, { passive: false });

        zone.addEventListener('touchend', reset, { passive: false });
        zone.addEventListener('touchcancel', reset, { passive: false });
      }

      function boot() {
        setPlayerStart();
        initWorld();
        setMode('hook');
        attachEvents();
        requestAnimationFrame(loop);
      }

      boot();
    })();
  </script>
</body>
</html>
